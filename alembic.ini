# Alembic configuration file for RecipeMate.
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration file names.
# Default: %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template date/time tokens. Defaults to UTC.
# timezone =

# Max length of the "slug" part of the generated filename. Default: 40.
truncate_slug_length = 40

# sys.path path; you can use this to make your application importable.
# Add the project root so `from app import db` resolves correctly.
prepend_sys_path = .

# Version number formatting; set to "true" to use a 3-digit format.
# version_num_format =

# The SQLAlchemy URL is read from the DATABASE_URL environment variable at
# runtime inside migrations/env.py.  This placeholder is overridden there, so
# the value below is never actually used — it exists only to satisfy the Alembic
# parser which requires the key to be present.
sqlalchemy.url = driver://user:pass@host/dbname

# Logging ----------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
